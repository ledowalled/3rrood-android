name: Build 3rrood APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Project ZIP
        run: |
          curl -fL "https://github.com/ledowalled/3rrood-android/releases/download/upload-test/3rrood-android-project.zip" -o 3rrood-android-project.zip
          ls -lh 3rrood-android-project.zip

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses

      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: unzip -o 3rrood-android-project.zip -d source

      - name: Fix annotation dependency
        run: |
          sed -i '/dependencies[[:space:]]*{/a\    implementation "androidx.annotation:annotation:1.9.1"' source/3rrood-android/app/build.gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd source/3rrood-android
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: 3rrood-APK
          path: source/3rrood-android/app/build/outputs/apk/debug/*.apk
